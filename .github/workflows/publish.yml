name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  release-check:
    name: release-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/release_check.py

  publish:
    name: publish
    needs: release-check
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv build
      - run: uv run twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: vars.PUBLISH_ENABLED == 'true'
        with:
          attestations: true