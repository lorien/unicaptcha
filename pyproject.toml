[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "unicaptcha"
description = "Universal async/sync interface to multiple anti-captcha services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["captcha", "anticaptcha", "2captcha", "capmonster", "recaptcha", "hcaptcha"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/lorien/unicaptcha"

[tool.hatch.version]
path = "unicaptcha/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["unicaptcha"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.format]
exclude = ["*.md", "*.markdown"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true

[tool.pyright]
typeCheckingMode = "strict"
include = ["unicaptcha"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
addopts = "-m 'not integration'"
markers = [
    "integration: tests hitting real provider APIs; deselected by default, require API keys via environment",
]

[tool.coverage.run]
source = ["unicaptcha"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
# Informational only (ADR-0047): no fail_under gate.

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "slotscheck>=0.16",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]
